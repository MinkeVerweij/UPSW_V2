name: upsw
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - ipykernel
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - laspy
  - lazrs-python        # LAZ compression support for laspy
  - alphashape
  - aiohttp
  - aiofiles
  - requests
  - tqdm
  - ipywidgets
  - nest-asyncio
  - datashader
  - numba
  - pyntcloud
  - timm
  - pytorch             # CPU build; replace with pytorch-cuda=12.1 for GPU
  - pip
  - pip:
    - laspy[lazrs]      # ensures lazrs backend is registered
